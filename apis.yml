aid: reserve-requirements
name: Reserve Requirements
kind: topic
description: >-
  Reserve Requirements refers to the Federal Reserve's Regulation D framework governing reserve requirement ratios for
  depository institutions. As of March 26, 2020, the Federal Reserve reduced all reserve requirement ratios to zero
  percent, eliminating reserve requirements for all depository institutions. The Federal Reserve provides data access
  through FRED (Federal Reserve Economic Data), the H.6 Money Stock Measures release, and the federalreserve.gov data
  download program for historical reserve and monetary base data.
