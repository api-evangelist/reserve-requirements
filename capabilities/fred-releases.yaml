naftiko: 1.0.0-alpha2
info:
  label: FRED API - Federal Reserve Economic Data — Releases
  description: 'FRED API - Federal Reserve Economic Data — Releases. 3 operations. Lead operation: Get Release. Self-contained
    Naftiko capability covering one Reserve Requirements business surface.'
  tags:
  - Reserve Requirements
  - Releases
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    RESERVE_REQUIREMENTS_API_KEY: RESERVE_REQUIREMENTS_API_KEY
capability:
  consumes:
  - type: http
    namespace: fred-releases
    baseUri: https://api.stlouisfed.org/fred
    description: FRED API - Federal Reserve Economic Data — Releases business capability. Self-contained, no shared references.
    resources:
    - name: release
      path: /release
      operations:
      - name: getrelease
        method: GET
        description: Get Release
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: release_id
          in: query
          type: integer
          description: The release ID.
          required: true
    - name: release-series
      path: /release/series
      operations:
      - name: getreleaseseries
        method: GET
        description: Get Release Series
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: release_id
          in: query
          type: integer
          description: The release ID.
          required: true
        - name: limit
          in: query
          type: integer
          description: Maximum number of results.
    - name: releases
      path: /releases
      operations:
      - name: listreleases
        method: GET
        description: List Releases
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: limit
          in: query
          type: integer
          description: Maximum number of results.
        - name: offset
          in: query
          type: integer
          description: Offset for pagination.
    authentication:
      type: apikey
      key: api_key
      value: '{{env.RESERVE_REQUIREMENTS_API_KEY}}'
      placement: query
  exposes:
  - type: rest
    namespace: fred-releases-rest
    port: 8080
    description: REST adapter for FRED API - Federal Reserve Economic Data — Releases. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/release
      name: release
      description: REST surface for release.
      operations:
      - method: GET
        name: getrelease
        description: Get Release
        call: fred-releases.getrelease
        with:
          release_id: rest.release_id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/release/series
      name: release-series
      description: REST surface for release-series.
      operations:
      - method: GET
        name: getreleaseseries
        description: Get Release Series
        call: fred-releases.getreleaseseries
        with:
          release_id: rest.release_id
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/releases
      name: releases
      description: REST surface for releases.
      operations:
      - method: GET
        name: listreleases
        description: List Releases
        call: fred-releases.listreleases
        with:
          limit: rest.limit
          offset: rest.offset
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: fred-releases-mcp
    port: 9090
    transport: http
    description: MCP adapter for FRED API - Federal Reserve Economic Data — Releases. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: get-release
      description: Get Release
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: fred-releases.getrelease
      with:
        release_id: tools.release_id
      outputParameters:
      - type: object
        mapping: $.
    - name: get-release-series
      description: Get Release Series
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: fred-releases.getreleaseseries
      with:
        release_id: tools.release_id
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: list-releases
      description: List Releases
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: fred-releases.listreleases
      with:
        limit: tools.limit
        offset: tools.offset
      outputParameters:
      - type: object
        mapping: $.
